name: Release

on:
  push:
    branches: [main]
    paths: [package.json, .github/workflows/release.yaml]
  workflow_dispatch:
    inputs:
      version:
        description: patch, minor, major, prepatch, preminor, premajor, prerelease, or an explicit version
        required: true
        type: string

concurrency: release

jobs:
  release:
    if: github.repository == 'globalbrain/sefirot'
    uses: globalbrain/hado/.github/workflows/release.reusable.yaml@556458ffbe94c080414cd22a7d905cb9fa2c81cc # v0.22.10
    with:
      version: ${{ inputs.version }}
      publish: pnpm publish --access public
      environment: npm
      environment_url: https://npmx.dev/package/@globalbrain/sefirot/v/{0}
    permissions:
      actions: read
      contents: write
      id-token: write
      pull-requests: write
