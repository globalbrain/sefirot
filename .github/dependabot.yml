version: 2

updates:
  # The workflows pin actions by commit SHA; dependabot is what keeps those pins current, rewriting
  # both the SHA and its `# vX.Y.Z` comment.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: Etc/UTC
    open-pull-requests-limit: 5
    # A week is what zizmor's dependabot-cooldown audit asks for, and it covers `minimumReleaseAge`.
    cooldown:
      default-days: 7
    commit-message:
      prefix: ci
    groups:
      actions:
        patterns: ['*']

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    versioning-strategy: increase
    cooldown:
      default-days: 7
    commit-message:
      prefix: chore
    groups:
      dependencies:
        patterns: ['*']
        update-types: [minor, patch]
